<!DOCTYPE html>

<html>
<head>
    <title>Register</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>
{% with messages = get_flashed_messages() %}

{% if messages %}

    {% for message in messages %}

        <div class="alert">
            {{ message }}
        </div>

    {% endfor %}

{% endif %}

{% endwith %}
<body>

<div class="form-container">

<div class="card">

    <h1>Create Account</h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="email"
            name="email"
            placeholder="Email"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Register
        </button>

    </form>

</div>

</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
