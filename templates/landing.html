<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .container{
            width:90%;
            max-width:800px;
            text-align:center;
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(15px);
            padding:50px;
            border-radius:20px;
            color:white;
            box-shadow:0 8px 30px rgba(0,0,0,.2);
        }

        h1{
            font-size:3rem;
            margin-bottom:20px;
        }

        p{
            font-size:1.2rem;
            margin-bottom:35px;
            line-height:1.6;
        }

        .btn{
            text-decoration:none;
            padding:15px 30px;
            border-radius:10px;
            color:white;
            font-weight:bold;
            margin:10px;
            display:inline-block;
            transition:.3s;
        }

        .register{
            background:#22c55e;
        }

        .login{
            background:#3b82f6;
        }

        .btn:hover{
            transform:translateY(-4px);
        }

    </style>
</head>
<body>

<div class="container">

    <h1>🤖 AI Text Summarizer</h1>

    <p>
        Convert lengthy articles, reports, blogs and
        documents into concise summaries using
        state-of-the-art Artificial Intelligence.
    </p>

    <a href="/register" class="btn register">
        Register
    </a>

    <a href="/login" class="btn login">
        Login
    </a>

</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
